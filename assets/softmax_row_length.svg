  <circle class="s1 ring" cx="530.7" cy="243.9" r="4.5"/>
  <circle class="s1 ring" cx="630" cy="250.6" r="4.5"/>
  <polyline class="line l3" points="84,181.6 232.9,175.6 332.2,233.7 431.5,253.4 530.7,255.2 630,269.7"/>
  <circle class="s3 ring" cx="84" cy="181.6" r="4.5"/>
  <circle class="s3 ring" cx="232.9" cy="175.6" r="4.5"/>
  <circle class="s3 ring" cx="332.2" cy="233.7" r="4.5"/>
  <circle class="s3 ring" cx="431.5" cy="253.4" r="4.5"/>
  <circle class="s3 ring" cx="530.7" cy="255.2" r="4.5"/>
  <circle class="s3 ring" cx="630" cy="269.7" r="4.5"/>
  <text class="label" x="642" y="255.1">block per row</text>
  <text class="label" x="642" y="274.2">warp per row</text>
</svg>
