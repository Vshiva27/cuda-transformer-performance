<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
  <title id="t">Softmax: the best design depends on the row length</title>
  <desc id="d">Columns 32..65536. Block per row: 15.1653, 106.459, 243.783, 202.361, 122.542, 112.414 GB/s. Warp per row: 218.025, 227.12, 138.158, 108.118, 105.313, 83.1309 GB/s.</desc>
  <style>
    .title { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub   { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .value { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .note  { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tick  { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .grid, .base, .ref, .mark { stroke-width: 1; fill: none; }
    .ref { stroke-dasharray: 4 3; }
    .mark { stroke-width: 2; }
    .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .ring { stroke-width: 2; }
    .bg { fill: #fcfcfb; stroke: #e6e5e0; }
    .title, .label, .value { fill: #0b0b0b; }
    .sub, .note, .tick { fill: #52514e; }
    .grid { stroke: #ebeae6; }
    .base { stroke: #b9b8b2; }
    .ref { stroke: #52514e; }
    .mark { stroke: #0b0b0b; }
    .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
    .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; }
    .ring { stroke: #fcfcfb; }
    @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: #333331; }
    .title, .label, .value { fill: #ffffff; }
    .sub, .note, .tick { fill: #c3c2b7; }
    .grid { stroke: #2e2e2c; }
    .base { stroke: #5c5b57; }
    .ref { stroke: #c3c2b7; }
    .mark { stroke: #ffffff; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .ring { stroke: #1a1a19; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="799" height="379" rx="12"/>
  <text class="title" x="24" y="36">Softmax: the best design depends on the row length</text>
  <text class="sub" x="24" y="58">~16M elements per point, rows getting longer and fewer · GB/s on a Tesla T4</text>
  <rect class="s1" x="24" y="74" width="12" height="12" rx="2"/>
  <text class="note" x="42" y="84">Block per row (shared-memory tree)</text>
  <rect class="s3" x="306.64" y="74" width="12" height="12" rx="2"/>
  <text class="note" x="324.6" y="84">Warp per row (shuffles)</text>
