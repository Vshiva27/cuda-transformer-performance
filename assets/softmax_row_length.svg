  <text class="tick" x="84" y="344" text-anchor="middle">32</text>
  <text class="tick" x="232.9" y="344" text-anchor="middle">256</text>
  <text class="tick" x="332.2" y="344" text-anchor="middle">1K</text>
  <text class="tick" x="431.5" y="344" text-anchor="middle">4K</text>
