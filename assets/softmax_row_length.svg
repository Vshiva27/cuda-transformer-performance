  <circle class="s1 ring" cx="84" cy="314.1" r="4.5"/>
  <circle class="s1 ring" cx="232.9" cy="254.4" r="4.5"/>
  <circle class="s1 ring" cx="332.2" cy="164.7" r="4.5"/>
