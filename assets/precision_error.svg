<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
  <title id="t">Why accumulation stays in FP32</title>
  <desc id="d">K = 64, 256, 1024, 4096, 16384. FP32 accumulation error: 3.437e-7, 5.823e-7, 0.000001273, 0.000002356, 0.000004347. FP16 accumulation error: 0.002343, 0.003592, 0.007627, 0.01577, 0.03616.</desc>
  <style>
    .title { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub   { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .value { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .note  { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tick  { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .grid, .base, .ref, .mark { stroke-width: 1; fill: none; }
    .ref { stroke-dasharray: 4 3; }
    .mark { stroke-width: 2; }
    .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .ring { stroke-width: 2; }
    .bg { fill: #fcfcfb; stroke: #e6e5e0; }
    .title, .label, .value { fill: #0b0b0b; }
    .sub, .note, .tick { fill: #52514e; }
    .grid { stroke: #ebeae6; }
    .base { stroke: #b9b8b2; }
    .ref { stroke: #52514e; }
    .mark { stroke: #0b0b0b; }
    .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
    .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; }
    .ring { stroke: #fcfcfb; }
    @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: #333331; }
    .title, .label, .value { fill: #ffffff; }
    .sub, .note, .tick { fill: #c3c2b7; }
    .grid { stroke: #2e2e2c; }
    .base { stroke: #5c5b57; }
    .ref { stroke: #c3c2b7; }
    .mark { stroke: #ffffff; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .ring { stroke: #1a1a19; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="799" height="379" rx="12"/>
  <text class="title" x="24" y="36">Why accumulation stays in FP32</text>
  <text class="sub" x="24" y="58">GEMM with FP16 inputs, 64 × 64 × K · max error / max |exact| (log scale) · Tesla T4</text>
  <rect class="s3" x="24" y="74" width="12" height="12" rx="2"/>
  <text class="note" x="42" y="84">FP16 accumulator</text>
  <rect class="s1" x="181.35999999999999" y="74" width="12" height="12" rx="2"/>
  <text class="note" x="199.4" y="84">FP32 accumulator</text>
  <line class="base" x1="84" y1="324" x2="630" y2="324"/>
  <text class="tick" x="74" y="328" text-anchor="end">10⁻⁷</text>
  <line class="grid" x1="84" y1="291.3" x2="630" y2="291.3"/>
  <text class="tick" x="74" y="295.3" text-anchor="end">10⁻⁶</text>
  <line class="grid" x1="84" y1="258.7" x2="630" y2="258.7"/>
  <text class="tick" x="74" y="262.7" text-anchor="end">10⁻⁵</text>
  <line class="grid" x1="84" y1="226" x2="630" y2="226"/>
  <text class="tick" x="74" y="230" text-anchor="end">10⁻⁴</text>
  <line class="grid" x1="84" y1="193.3" x2="630" y2="193.3"/>
  <text class="tick" x="74" y="197.3" text-anchor="end">10⁻³</text>
  <line class="grid" x1="84" y1="160.7" x2="630" y2="160.7"/>
  <text class="tick" x="74" y="164.7" text-anchor="end">10⁻²</text>
  <line class="grid" x1="84" y1="128" x2="630" y2="128"/>
  <text class="tick" x="74" y="132" text-anchor="end">10⁻¹</text>
  <text class="tick" x="74" y="114" text-anchor="end">error</text>
  <text class="tick" x="84" y="344" text-anchor="middle">64</text>
  <text class="tick" x="220.5" y="344" text-anchor="middle">256</text>
  <text class="tick" x="357" y="344" text-anchor="middle">1,024</text>
  <text class="tick" x="493.5" y="344" text-anchor="middle">4,096</text>
  <text class="tick" x="630" y="344" text-anchor="middle">16,384</text>
  <text class="tick" x="630" y="362" text-anchor="end">K (length of each dot product)</text>
  <line class="ref" x1="630" y1="270.5" x2="630" y2="142.4"/>
  <text class="value" x="620" y="211" text-anchor="end">8,300× more error</text>
  <polyline class="line l3" points="84,181.3 220.5,175.2 357,164.5 493.5,154.2 630,142.4"/>
  <circle class="s3 ring" cx="84" cy="181.3" r="4.5"/>
  <circle class="s3 ring" cx="220.5" cy="175.2" r="4.5"/>
  <circle class="s3 ring" cx="357" cy="164.5" r="4.5"/>
  <circle class="s3 ring" cx="493.5" cy="154.2" r="4.5"/>
  <circle class="s3 ring" cx="630" cy="142.4" r="4.5"/>
  <polyline class="line l1" points="84,306.5 220.5,299 357,287.9 493.5,279.2 630,270.5"/>
  <circle class="s1 ring" cx="84" cy="306.5" r="4.5"/>
  <circle class="s1 ring" cx="220.5" cy="299" r="4.5"/>
  <circle class="s1 ring" cx="357" cy="287.9" r="4.5"/>
  <circle class="s1 ring" cx="493.5" cy="279.2" r="4.5"/>
  <circle class="s1 ring" cx="630" cy="270.5" r="4.5"/>
  <text class="label" x="642" y="146.9">FP16 accumulator</text>
  <text class="label" x="642" y="275">FP32 accumulator</text>
</svg>
