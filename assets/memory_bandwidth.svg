<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 0 800 376" role="img" aria-labelledby="t d">
  <title id="t">Memory-bound kernels: achieved DRAM bandwidth</title>
  <desc id="d">Vector add: ours 262.687, PyTorch 246.4061231534583. Softmax 12288x1024: naive 31.8482, ours 243.162, PyTorch 216.23430696706646. LayerNorm 8192x4096: naive 34.1689, ours 230.099, PyTorch 166.24650042987454. Peak 320.1 GB/s.</desc>
