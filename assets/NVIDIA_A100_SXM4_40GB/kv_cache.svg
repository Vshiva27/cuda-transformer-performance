<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
  <title id="t">KV cache: cost of generating one token</title>
  <desc id="d">Context 128, 512, 1024, 2048. With KV cache: 0.0342579, 0.128635, 0.25492, 0.506803 ms. Recomputing attention: 0.0384512, 0.309094, 1.08728, 3.50013 ms.</desc>
  <style>
    .title { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub   { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .value { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .note  { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tick  { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .grid, .base, .ref, .mark { stroke-width: 1; fill: none; }
    .ref { stroke-dasharray: 4 3; }
    .mark { stroke-width: 2; }
    .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .ring { stroke-width: 2; }
    .bg { fill: #fcfcfb; stroke: #e6e5e0; }
    .title, .label, .value { fill: #0b0b0b; }
    .sub, .note, .tick { fill: #52514e; }
    .grid { stroke: #ebeae6; }
    .base { stroke: #b9b8b2; }
    .ref { stroke: #52514e; }
    .mark { stroke: #0b0b0b; }
    .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
    .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; }
    .ring { stroke: #fcfcfb; }
    @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: #333331; }
    .title, .label, .value { fill: #ffffff; }
    .sub, .note, .tick { fill: #c3c2b7; }
    .grid { stroke: #2e2e2c; }
    .base { stroke: #5c5b57; }
    .ref { stroke: #c3c2b7; }
    .mark { stroke: #ffffff; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .ring { stroke: #1a1a19; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="799" height="379" rx="12"/>
  <text class="title" x="24" y="36">KV cache: cost of generating one token</text>
  <text class="sub" x="24" y="58">Attention time for one decoding step, 12 heads, d = 64 · ms (log scale) · NVIDIA A100-SXM4-40GB</text>
  <rect class="s3" x="24" y="74" width="12" height="12" rx="2"/>
  <text class="note" x="42" y="84">Recompute attention for all tokens</text>
  <rect class="s1" x="306.64" y="74" width="12" height="12" rx="2"/>
  <text class="note" x="324.6" y="84">With KV cache (1 query)</text>
  <line class="base" x1="84" y1="324" x2="630" y2="324"/>
  <text class="tick" x="74" y="328" text-anchor="end">0.01</text>
  <line class="grid" x1="84" y1="258.7" x2="630" y2="258.7"/>
  <text class="tick" x="74" y="262.7" text-anchor="end">0.1</text>
  <line class="grid" x1="84" y1="193.3" x2="630" y2="193.3"/>
  <text class="tick" x="74" y="197.3" text-anchor="end">1</text>
  <line class="grid" x1="84" y1="128" x2="630" y2="128"/>
  <text class="tick" x="74" y="132" text-anchor="end">10</text>
  <text class="tick" x="74" y="114" text-anchor="end">ms</text>
  <text class="tick" x="84" y="344" text-anchor="middle">128</text>
  <text class="tick" x="357" y="344" text-anchor="middle">512</text>
  <text class="tick" x="493.5" y="344" text-anchor="middle">1,024</text>
  <text class="tick" x="630" y="344" text-anchor="middle">2,048</text>
  <text class="tick" x="630" y="362" text-anchor="end">context length (tokens)</text>
  <line class="ref" x1="630" y1="212.6" x2="630" y2="157.8"/>
  <text class="value" x="620" y="189.7" text-anchor="end">7× cheaper</text>
  <polyline class="line l3" points="84,285.8 357,226.6 493.5,191 630,157.8"/>
  <circle class="s3 ring" cx="84" cy="285.8" r="4.5"/>
  <circle class="s3 ring" cx="357" cy="226.6" r="4.5"/>
  <circle class="s3 ring" cx="493.5" cy="191" r="4.5"/>
  <circle class="s3 ring" cx="630" cy="157.8" r="4.5"/>
  <polyline class="line l1" points="84,289.1 357,251.5 493.5,232.1 630,212.6"/>
  <circle class="s1 ring" cx="84" cy="289.1" r="4.5"/>
  <circle class="s1 ring" cx="357" cy="251.5" r="4.5"/>
  <circle class="s1 ring" cx="493.5" cy="232.1" r="4.5"/>
  <circle class="s1 ring" cx="630" cy="212.6" r="4.5"/>
  <text class="label" x="642" y="162.3">recompute all</text>
  <text class="label" x="642" y="217.1">with KV cache</text>
</svg>
